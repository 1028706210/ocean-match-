<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>海底消消乐</title>
<style>
:root{
  --bg:#FFF8F0; --bg-low:#E8F5F2; --panel:#FFFFFF; --panel-2:#FFF1E2;
  --ink:#2A3B57; --muted:#8793A6; --line:#F0E2CF;
  --rose:#FF6B8F; --rose-dark:#D9486D; --rose-soft:#FFE3EA;
  --sea:#2DB3C2; --sea-dark:#1B8C9A; --sea-soft:#D8F2F4;
  --gold:#FFC23D; --gold-dark:#E39A00; --ice:#BDE7FF;
  --tray:#F3E4CC; --cellA:#FFF6E8; --cellB:#FBEBD6; --trayEdge:#E4CFAE;
  --shadow:0 12px 32px rgba(110,80,50,.16); --scrim:rgba(42,59,87,.40);
  --font-display:"ZCOOL KuaiLe","Yuanti SC","YouYuan","Hannotate SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C2E; --bg-low:#0A3550; --panel:#16293F; --panel-2:#1C334D;
    --ink:#EAF2FF; --muted:#8FA4BF; --line:#25405E;
    --rose:#FF7FA0; --rose-dark:#D95079; --rose-soft:#3A2A45;
    --sea:#4CCAD8; --sea-dark:#2A9FAE; --sea-soft:#14414D;
    --gold:#FFCB55; --gold-dark:#E5A100; --ice:#7CC8F0;
    --tray:#1A3350; --cellA:#223C5B; --cellB:#1E3652; --trayEdge:#12263B;
    --shadow:0 12px 32px rgba(0,0,0,.45); --scrim:rgba(4,12,22,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C2E; --bg-low:#0A3550; --panel:#16293F; --panel-2:#1C334D;
  --ink:#EAF2FF; --muted:#8FA4BF; --line:#25405E;
  --rose:#FF7FA0; --rose-dark:#D95079; --rose-soft:#3A2A45;
  --sea:#4CCAD8; --sea-dark:#2A9FAE; --sea-soft:#14414D;
  --gold:#FFCB55; --gold-dark:#E5A100; --ice:#7CC8F0;
  --tray:#1A3350; --cellA:#223C5B; --cellB:#1E3652; --trayEdge:#12263B;
  --shadow:0 12px 32px rgba(0,0,0,.45); --scrim:rgba(4,12,22,.62);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  overscroll-behavior:none; display:flex; justify-content:center; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
button:focus-visible{ outline:3px solid var(--sea); outline-offset:3px; }
svg{ display:block; }
.ico{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.ico.fill{ fill:currentColor; stroke:none; }

#app{ position:relative; width:100%; max-width:500px; height:100%; overflow:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 58%,var(--bg-low) 100%); }
#sea{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.bub{ position:absolute; bottom:-60px; border-radius:50%; border:2px solid var(--sea); opacity:.0; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%); animation:rise linear infinite; }
@keyframes rise{ 0%{ transform:translateY(0) translateX(0); opacity:0 } 10%{ opacity:.35 } 90%{ opacity:.25 } 100%{ transform:translateY(-110vh) translateX(18px); opacity:0 } }

.screen{ position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; visibility:hidden; transition:opacity .28s, visibility .28s; }
.screen.on{ opacity:1; visibility:visible; }

/* 通用按钮 */
.icon-btn{ width:44px; height:44px; border-radius:16px; display:grid; place-items:center; color:var(--ink); background:var(--panel); border:1px solid var(--line); }
.icon-btn:active{ transform:scale(.94); }
.btn{ font-family:var(--font-display); font-size:21px; letter-spacing:.08em; padding:14px 30px; border-radius:999px; transition:transform .08s, box-shadow .08s; }
.btn.primary{ background:var(--rose); color:#fff; box-shadow:0 5px 0 var(--rose-dark); }
.btn.primary:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--rose-dark); }
.btn.sea{ background:var(--sea); color:#fff; box-shadow:0 5px 0 var(--sea-dark); }
.btn.sea:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--sea-dark); }
.btn.ghost{ border:2px solid var(--line); color:var(--ink); background:var(--panel); }
.btn.ghost:active{ transform:scale(.97); }
.btn.small{ font-size:17px; padding:11px 22px; }

/* 标题页 */
.top-right{ position:absolute; top:12px; right:14px; z-index:2; }
.title-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:0 20px; }
#mascot{ width:min(86vw,340px); aspect-ratio:340/250; }
#t-title{ margin:6px 0 0; font-family:var(--font-display); font-weight:400; font-size:clamp(40px,12vw,54px); letter-spacing:.06em; color:var(--ink); text-shadow:0 3px 0 var(--rose-soft); }
#t-sub{ margin:0; font-size:16px; color:var(--muted); letter-spacing:.12em; }
.btn-col{ display:flex; flex-direction:column; gap:14px; padding:0 40px 44px; }
.btn-col .btn{ width:100%; }

/* 关卡页 */
.bar{ display:flex; align-items:center; gap:12px; padding:12px 14px 8px; }
.bar h2{ flex:1; margin:0; font-family:var(--font-display); font-weight:400; font-size:26px; letter-spacing:.08em; }
.lv-scroll{ flex:1; overflow-y:auto; padding:8px 18px 32px; }
#lv-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:18px 10px; }
.lv{ display:flex; flex-direction:column; align-items:center; gap:5px; }
.lv > button{ width:100%; max-width:62px; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; position:relative;
  font-family:var(--font-display); font-size:24px; background:var(--panel); border:2.5px solid var(--sea); color:var(--ink); }
.lv > button:active{ transform:scale(.93); }
.lv.done > button{ background:var(--sea-soft); }
.lv.cur > button{ background:var(--rose); border-color:var(--rose-dark); color:#fff; box-shadow:0 0 0 5px var(--rose-soft); }
.lv.lock > button{ border-color:var(--line); color:var(--muted); background:var(--panel-2); cursor:default; }
.lv.lock > button .ico{ width:22px; height:22px; }
.stars{ display:flex; gap:1px; height:13px; }
.stars .ico{ width:13px; height:13px; color:var(--line); }
.stars .ico.on{ color:var(--gold); }

/* 游戏页 */
.game-bar{ padding-bottom:4px; }
.game-bar h2{ text-align:center; font-size:24px; }
.hud{ display:flex; gap:10px; padding:4px 14px 6px; align-items:stretch; }
.moves{ flex:none; width:84px; border-radius:20px; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 0 4px; }
.moves span{ font-size:12px; color:var(--muted); letter-spacing:.2em; margin-right:-.2em; }
.moves b{ font-family:var(--font-display); font-weight:400; font-size:36px; line-height:1.05; color:var(--ink); }
.moves b.low{ color:var(--rose-dark); }
.goals{ flex:1; display:flex; flex-wrap:wrap; gap:8px; align-content:center; }
.goal{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:4px 12px 4px 6px; min-height:42px; }
.goal img{ width:32px; height:32px; }
.goal .gi{ width:32px; height:32px; border-radius:10px; background:var(--ice); display:grid; place-items:center; color:#fff; }
.goal .gi .ico{ width:18px; height:18px; }
.goal b{ font-family:var(--font-display); font-weight:400; font-size:21px; min-width:1.2em; }
.goal.done{ background:var(--sea-soft); border-color:var(--sea); }
.goal.done b{ color:var(--sea-dark); }
.goal .tx{ font-size:13px; color:var(--muted); }
.goal.bump{ animation:bump .25s; }
@keyframes bump{ 50%{ transform:scale(1.12) } }
.scorebar{ display:flex; align-items:center; gap:10px; padding:2px 18px 6px; }
.track{ position:relative; flex:1; height:10px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); }
.track i{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--sea),#7FE3D4); transition:width .3s; }
.track .mk{ position:absolute; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; color:var(--line); }
.track .mk svg{ width:100%; height:100%; stroke:var(--panel); stroke-width:1.5; paint-order:stroke; }
.track .mk.on{ color:var(--gold); animation:bump .4s; }
#h-score{ font-family:var(--font-display); font-size:20px; min-width:3.6em; text-align:right; }
#board-wrap{ position:relative; flex:1; min-height:0; touch-action:none; }
#cv{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); touch-action:none; }
#toast{ position:absolute; left:50%; top:4px; transform:translate(-50%,-6px); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap; z-index:3; }
#toast.on{ opacity:1; transform:translate(-50%,0); }
.boosters{ display:flex; justify-content:center; gap:16px; padding:8px 16px 16px; }
.booster{ position:relative; width:84px; height:62px; border-radius:20px; background:var(--panel); border:2px solid var(--line); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; }
.booster .ico{ width:24px; height:24px; }
.booster:active{ transform:scale(.95); }
.booster.armed{ border-color:var(--rose); background:var(--rose-soft); color:var(--rose-dark); }
.booster:disabled{ opacity:.45; cursor:default; }
.booster .cnt{ position:absolute; top:-8px; right:-6px; min-width:22px; height:22px; border-radius:999px; background:var(--rose); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; padding:0 5px; border:2px solid var(--bg); }
.fly{ position:absolute; z-index:6; width:30px; height:30px; pointer-events:none; left:0; top:0; }

/* 玩法说明 */
.help-sec{ text-align:left; margin:16px 0 4px; font-family:var(--font-display); font-weight:400; font-size:19px; color:var(--sea-dark); }
.help-row{ display:flex; align-items:center; gap:10px; text-align:left; margin:8px 0; font-size:14px; line-height:1.55; color:var(--ink); }
.help-row img{ width:44px; height:44px; flex:none; }
.help-row b{ color:var(--rose-dark); }
.help-combo{ display:flex; flex-wrap:wrap; gap:6px; text-align:left; }
.help-combo span{ background:var(--sea-soft); color:var(--sea-dark); border-radius:10px; padding:4px 10px; font-size:13px; }
.help-note{ font-size:13px; color:var(--muted); text-align:left; line-height:1.65; margin-top:8px; }
.help-note b{ color:var(--ink); }

/* 弹窗 */
.modal{ position:absolute; inset:0; z-index:10; background:var(--scrim); display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:opacity .22s, visibility .22s; padding:20px; }
.modal.on{ opacity:1; visibility:visible; }
.sheet{ width:min(100%,350px); max-height:92%; overflow:auto; background:var(--panel); border-radius:30px; padding:26px 22px 22px; box-shadow:var(--shadow); text-align:center; transform:translateY(14px) scale(.97); transition:transform .3s cubic-bezier(.2,.9,.3,1.25); }
.modal.on .sheet{ transform:none; }
.sheet h3{ margin:0 0 6px; font-family:var(--font-display); font-weight:400; font-size:30px; letter-spacing:.06em; }
.sheet p{ margin:8px 0; line-height:1.7; font-size:15px; color:var(--muted); }
.sheet .row{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
.sheet .row .btn{ width:100%; }
.goal-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0 6px; text-align:left; }
.goal-list .goal{ padding:6px 14px 6px 8px; font-size:16px; }
.goal-list .goal span{ flex:1; }
.tip{ font-size:14px; color:var(--ink); background:var(--sea-soft); border-radius:16px; padding:10px 14px; line-height:1.6; margin-top:12px; text-align:left; }
.big-stars{ display:flex; justify-content:center; gap:6px; margin:10px 0 4px; }
.big-stars .ico{ width:58px; height:58px; color:var(--line); }
.big-stars .ico.on{ color:var(--gold); animation:starpop .55s both cubic-bezier(.2,1.6,.4,1); animation-delay:calc(var(--i)*.28s + .25s); }
.big-stars .ico:nth-child(2){ transform:translateY(-8px); }
@keyframes starpop{ 0%{ transform:scale(0) rotate(-40deg) } 100%{ transform:scale(1) rotate(0) } }
.score-big{ font-family:var(--font-display); font-size:28px; margin:2px 0 0; color:var(--ink); }
.toggle{ display:flex; align-items:center; justify-content:space-between; padding:12px 6px; font-size:17px; border-bottom:1px solid var(--line); }
.toggle:last-of-type{ border-bottom:0; }
.sw{ width:52px; height:30px; border-radius:999px; background:var(--line); position:relative; transition:background .2s; flex:none; }
.sw::after{ content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 2px 4px rgba(0,0,0,.2); }
.sw.on{ background:var(--sea); }
.sw.on::after{ transform:translateX(22px); }
@media (prefers-reduced-motion: reduce){
  .bub{ animation:none; display:none; }
  .screen,.modal,.sheet,.sw::after{ transition-duration:.01s; }
  .big-stars .ico.on,.goal.bump,.track .mk.on{ animation:none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sea" aria-hidden="true"></div>

  <section id="s-title" class="screen on" aria-label="标题页">
    <div class="top-right"><button class="icon-btn" id="t-sound" aria-label="声音设置"></button></div>
    <div class="title-wrap">
      <canvas id="mascot"></canvas>
      <h1 id="t-title"></h1>
      <p id="t-sub"></p>
    </div>
    <div class="btn-col">
      <button class="btn primary" id="btn-play">开始游戏</button>
      <button class="btn sea" id="btn-endless">无尽模式</button>
      <button class="btn ghost" id="btn-levels">选择关卡</button>
      <button class="btn ghost small" id="btn-help">玩法说明</button>
    </div>
  </section>

  <section id="s-levels" class="screen" aria-label="选择关卡">
    <header class="bar">
      <button class="icon-btn" id="lv-back" aria-label="返回"></button>
      <h2>选择关卡</h2>
    </header>
    <div class="lv-scroll"><div id="lv-grid"></div></div>
  </section>

  <section id="s-game" class="screen" aria-label="游戏">
    <header class="bar game-bar">
      <button class="icon-btn" id="g-back" aria-label="暂停"></button>
      <h2 id="g-title">第 1 关</h2>
      <button class="icon-btn" id="g-sound" aria-label="声音设置"></button>
    </header>
    <div class="hud">
      <div class="moves"><span>步数</span><b id="h-moves">0</b></div>
      <div class="goals" id="h-goals"></div>
    </div>
    <div class="scorebar">
      <div class="track"><i id="h-fill"></i><span id="h-marks"></span></div>
      <b id="h-score">0</b>
    </div>
    <div id="board-wrap">
      <canvas id="cv"></canvas>
      <div id="toast" role="status"></div>
    </div>
    <footer class="boosters">
      <button class="booster" id="b-hammer" aria-label="小锤子"><span class="ic"></span><span>小锤子</span><i class="cnt">3</i></button>
      <button class="booster" id="b-shuffle" aria-label="洗牌"><span class="ic"></span><span>洗牌</span><i class="cnt">2</i></button>
      <button class="booster" id="b-hint" aria-label="提示"><span class="ic"></span><span>提示</span></button>
    </footer>
  </section>

  <div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<script>
/* ================= 可自定义内容 ================= */
const CFG = {
  title: '海底消消乐'
};
/* ================= 逻辑层：棋盘 / 匹配 / 特殊块 / 消除流程 =================
   与画面无关：画面层通过 host 接口接收动画指令。 */
const K = { N: 0, H: 1, V: 2, B: 3, R: 4, X: 5, D: 6 };   // 普通 / 横条 / 竖条 / 炸弹 / 彩虹珍珠 / 十字水母 / 钻石海螺
const key = (r, c) => r * 64 + c;

class Piece {
  constructor(type, kind) {
    this.type = type; this.kind = kind || K.N;
    this.r = 0; this.c = 0;                       // 逻辑位置
    this.x = 0; this.y = 0; this.vy = 0;          // 画面位置（格子单位）
    this.sx = 1; this.sy = 1; this.alpha = 1; this.rot = 0;
    this.tw = null; this.dying = null; this.hidden = false;
    this.delayT = 0; this.sq = 0; this.pop = 0; this.noTrig = false;
    this.phase = Math.random() * 6.283; this.sel = false;
  }
}

class Board {
  constructor(lv) {
    this.w = lv.w; this.h = lv.h; this.colors = lv.colors;
    this.mask = []; this.grid = []; this.jelly = []; this.jellyTotal = 0;
    for (let r = 0; r < this.h; r++) {
      this.mask.push([]); this.grid.push([]); this.jelly.push([]);
      for (let c = 0; c < this.w; c++) {
        const ok = !(lv.layout && lv.layout[r][c] === '#');
        this.mask[r].push(ok); this.grid[r].push(null);
        let j = 0;
        if (ok && lv.jelly) { const ch = lv.jelly[r][c]; if (ch >= '1' && ch <= '9') j = +ch; }
        this.jelly[r].push(j); this.jellyTotal += j;
      }
    }
    this.top = []; this.bot = [];
    for (let c = 0; c < this.w; c++) {
      let t = -1, b = -1;
      for (let r = 0; r < this.h; r++) if (this.mask[r][c]) { if (t < 0) t = r; b = r; }
      this.top.push(t); this.bot.push(b);
    }
  }
  has(r, c) { return r >= 0 && r < this.h && c >= 0 && c < this.w && this.mask[r][c]; }
  at(r, c) { return this.has(r, c) ? this.grid[r][c] : null; }
  put(p, r, c) { this.grid[r][c] = p; p.r = r; p.c = c; }
  each(fn) {
    for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
      const p = this.grid[r][c]; if (p) fn(p, r, c);
    }
  }
  randType() { return Math.floor(Math.random() * this.colors); }

  fillInitial() {
    for (let attempt = 0; attempt < 300; attempt++) {
      for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
        if (!this.mask[r][c]) { this.grid[r][c] = null; continue; }
        const bad = new Set();
        const a1 = this.at(r, c - 1), a2 = this.at(r, c - 2);
        if (a1 && a2 && a1.type === a2.type) bad.add(a1.type);
        const b1 = this.at(r - 1, c), b2 = this.at(r - 2, c);
        if (b1 && b2 && b1.type === b2.type) bad.add(b1.type);
        const l1 = this.at(r, c - 1), u1 = this.at(r - 1, c), ul = this.at(r - 1, c - 1);
        if (l1 && u1 && ul && l1.type === u1.type && l1.type === ul.type) bad.add(l1.type);   // 避免 2×2 预置
        const opts = [];
        for (let t = 0; t < this.colors; t++) if (!bad.has(t)) opts.push(t);
        this.put(new Piece(opts[Math.floor(Math.random() * opts.length)]), r, c);
      }
      if (this.hasMove()) return;
    }
  }

  // ---- 匹配 ----
  findMatches(pref) {
    const runs = [];
    for (let r = 0; r < this.h; r++) {
      let c = 0;
      while (c < this.w) {
        const p = this.at(r, c);
        if (!p || p.kind === K.R) { c++; continue; }
        let e = c + 1;
        while (e < this.w) { const q = this.at(r, e); if (q && q.kind !== K.R && q.type === p.type) e++; else break; }
        if (e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push([r, k]); runs.push({ dir: 'h', type: p.type, cells }); }
        c = e;
      }
    }
    for (let c = 0; c < this.w; c++) {
      let r = 0;
      while (r < this.h) {
        const p = this.at(r, c);
        if (!p || p.kind === K.R) { r++; continue; }
        let e = r + 1;
        while (e < this.h) { const q = this.at(e, c); if (q && q.kind !== K.R && q.type === p.type) e++; else break; }
        if (e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push([k, c]); runs.push({ dir: 'v', type: p.type, cells }); }
        r = e;
      }
    }
    for (let r = 0; r + 1 < this.h; r++) for (let c = 0; c + 1 < this.w; c++) {
      const a = this.at(r, c), b2 = this.at(r, c + 1), d2 = this.at(r + 1, c), e2 = this.at(r + 1, c + 1);
      if (a && b2 && d2 && e2 && a.kind !== K.R && b2.kind !== K.R && d2.kind !== K.R && e2.kind !== K.R &&
          a.type === b2.type && a.type === d2.type && a.type === e2.type) {
        runs.push({ dir: 'sq', type: a.type, cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
      }
    }
    if (!runs.length) return [];
    const parent = runs.map((_, i) => i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    const owner = new Map();
    runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
      const k = key(r, c);
      if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
    }));
    const groups = new Map();
    runs.forEach((run, i) => {
      const root = find(i);
      if (!groups.has(root)) groups.set(root, { type: run.type, runs: [], cellMap: new Map() });
      const g = groups.get(root); g.runs.push(run);
      run.cells.forEach(([r, c]) => g.cellMap.set(key(r, c), [r, c]));
    });
    const res = [];
    for (const g of groups.values()) {
      const cells = [...g.cellMap.values()];
      const hr = g.runs.filter(x => x.dir === 'h'), vr = g.runs.filter(x => x.dir === 'v');
      const maxLen = Math.max(...g.runs.map(x => x.cells.length));
      const maxH = hr.length ? Math.max(...hr.map(x => x.cells.length)) : 0;
      const sq = g.runs.some(x => x.dir === 'sq');
      let kind = K.N;
      if (maxLen >= 5) kind = K.R;
      else if (sq) kind = K.X;                        // 2×2 方块 → 十字水母
      else if (hr.length && vr.length) kind = K.B;
      else if (maxLen === 4) kind = maxH === 4 ? K.V : K.H;   // 横向4连 → 竖条（清一整列）
      let spawn = null;
      if (kind !== K.N) spawn = this.pickSpawn(g, cells, hr, vr, kind, pref);
      res.push({ type: g.type, cells, kind: spawn ? kind : K.N, spawn });
    }
    return res;
  }
  pickSpawn(g, cells, hr, vr, kind, pref) {
    const normal = ([r, c]) => this.grid[r][c].kind === K.N;
    const cand = cells.filter(normal);
    if (!cand.length) return null;
    if (pref) for (const [pr, pc] of pref) { const f = cand.find(([r, c]) => r === pr && c === pc); if (f) return f; }
    if (kind === K.B) {
      for (const h of hr) for (const v of vr) for (const [r, c] of h.cells) {
        if (v.cells.some(([a, b]) => a === r && b === c) && normal([r, c])) return [r, c];
      }
    }
    const longest = g.runs.reduce((a, b) => b.cells.length > a.cells.length ? b : a);
    const m = longest.cells[Math.floor(longest.cells.length / 2)];
    return normal(m) ? m : cand[0];
  }

  // ---- 可走的步 ----
  swapCells(a, b) {
    const pa = this.grid[a[0]][a[1]], pb = this.grid[b[0]][b[1]];
    this.grid[a[0]][a[1]] = pb; this.grid[b[0]][b[1]] = pa;
    if (pa) { pa.r = b[0]; pa.c = b[1]; }
    if (pb) { pb.r = a[0]; pb.c = a[1]; }
  }
  isCombo(pa, pb) {
    if (!pa || !pb) return false;
    if (pa.kind === K.R || pb.kind === K.R) return true;
    return pa.kind !== K.N && pb.kind !== K.N;
  }
  moveValue(a, b) {
    const pa = this.grid[a[0]][a[1]], pb = this.grid[b[0]][b[1]];
    if (!pa || !pb) return 0;
    if (this.isCombo(pa, pb)) return 200;
    this.swapCells(a, b);
    const ms = this.findMatches([a, b]);
    this.swapCells(a, b);
    let v = 0;
    for (const g of ms) v += g.cells.length * 10 + (g.kind ? 40 : 0) + (g.kind === K.R ? 60 : 0);
    return v;
  }
  listMoves() {
    const out = [];
    for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
      if (!this.has(r, c)) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (!this.has(r2, c2)) continue;
        const v = this.moveValue([r, c], [r2, c2]);
        if (v > 0) out.push({ a: [r, c], b: [r2, c2], v });
      }
    }
    return out;
  }
  hasMove() {
    for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
      if (!this.has(r, c)) continue;
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (this.has(r2, c2) && this.moveValue([r, c], [r2, c2]) > 0) return true;
      }
    }
    return false;
  }
  bestMove() {
    const ms = this.listMoves(); if (!ms.length) return null;
    const mx = Math.max(...ms.map(m => m.v));
    const top = ms.filter(m => m.v >= mx - 10);
    return top[Math.floor(Math.random() * top.length)];
  }

  // ---- 消除范围展开（含特殊块连锁） ----
  commonColor(out) {
    const cnt = new Array(this.colors).fill(0);
    this.each((p, r, c) => { if (p.kind !== K.R && !out.has(key(r, c))) cnt[p.type]++; });
    let best = 0; for (let i = 1; i < cnt.length; i++) if (cnt[i] > cnt[best]) best = i;
    return best;
  }
  expand(seeds) {
    const out = new Map(), q = [], effects = [];
    const add = (r, c, depth, delay) => {
      if (!this.has(r, c)) return;
      const p = this.grid[r][c]; if (!p) return;
      const k = key(r, c); if (out.has(k)) return;
      out.set(k, { r, c, piece: p, depth, delay });
      if (p.kind !== K.N && !p.noTrig) q.push(k);
    };
    seeds.forEach(s => add(s.r, s.c, 0, s.delay || 0));
    while (q.length) {
      const e = out.get(q.shift()), p = e.piece, base = e.delay + 90;
      if (p.kind === K.H) {
        effects.push({ t: 'beam', dir: 'h', r: e.r, c: e.c, delay: e.delay, type: p.type });
        for (let c = 0; c < this.w; c++) add(e.r, c, e.depth + 1, base + Math.abs(c - e.c) * 24);
      } else if (p.kind === K.V) {
        effects.push({ t: 'beam', dir: 'v', r: e.r, c: e.c, delay: e.delay, type: p.type });
        for (let r = 0; r < this.h; r++) add(r, e.c, e.depth + 1, base + Math.abs(r - e.r) * 24);
      } else if (p.kind === K.B) {
        effects.push({ t: 'ring', r: e.r, c: e.c, delay: e.delay, rad: 1, type: p.type });
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(e.r + dr, e.c + dc, e.depth + 1, base);
      } else if (p.kind === K.X) {
        effects.push({ t: 'beam', dir: 'h', r: e.r, c: e.c, delay: e.delay, type: p.type }, { t: 'beam', dir: 'v', r: e.r, c: e.c, delay: e.delay, type: p.type });
        for (let c = 0; c < this.w; c++) add(e.r, c, e.depth + 1, base + Math.abs(c - e.c) * 24);
        for (let r = 0; r < this.h; r++) add(r, e.c, e.depth + 1, base + Math.abs(r - e.r) * 24);
      } else if (p.kind === K.D) {
        effects.push({ t: 'diag', r: e.r, c: e.c, delay: e.delay, type: p.type });
        for (let d = 1; d < Math.max(this.w, this.h); d++) {
          add(e.r - d, e.c - d, e.depth + 1, base + d * 28);
          add(e.r - d, e.c + d, e.depth + 1, base + d * 28);
          add(e.r + d, e.c - d, e.depth + 1, base + d * 28);
          add(e.r + d, e.c + d, e.depth + 1, base + d * 28);
        }
      } else if (p.kind === K.R) {
        const color = this.commonColor(out), targets = [];
        this.each((q2, r, c) => { if (q2.kind !== K.R && q2.type === color && !out.has(key(r, c))) targets.push([r, c]); });
        effects.push({ t: 'bolt', r: e.r, c: e.c, targets, delay: e.delay });
        targets.forEach(([r, c], i) => add(r, c, e.depth + 1, base + 60 + i * 40));
      }
    }
    return { cells: [...out.values()], effects };
  }

  // ---- 玩家交换出特殊组合 ----
  planCombo(pa, pb, pos) {
    const [pr, pc] = pos;
    const seeds = [], effects = [];
    let convert = null, label = '';
    const addSeed = (r, c, delay) => { if (this.has(r, c) && this.grid[r][c]) seeds.push({ r, c, delay }); };
    const isR = p => p.kind === K.R;
    if (isR(pa) && isR(pb)) {
      pa.noTrig = pb.noTrig = true;
      this.each((p, r, c) => addSeed(r, c, (Math.abs(r - pr) + Math.abs(c - pc)) * 28));
      effects.push({ t: 'flash', delay: 0 });
      label = '彩虹风暴！';
    } else if (isR(pa) || isR(pb)) {
      const rp = isR(pa) ? pa : pb, other = rp === pa ? pb : pa;
      rp.noTrig = true;
      addSeed(rp.r, rp.c, 0);
      if (other.kind === K.N) {
        const targets = [];
        this.each((p, r, c) => { if (p !== rp && p.kind !== K.R && p.type === other.type) targets.push([r, c]); });
        effects.push({ t: 'bolt', r: rp.r, c: rp.c, targets, delay: 0 });
        targets.forEach(([r, c], i) => addSeed(r, c, 140 + i * 45));
        label = '同色全消！';
      } else {
        convert = [];
        this.each((p, r, c) => {
          if (p !== rp && p.kind !== K.R && p.type === other.type) {
            convert.push({ piece: p, kind: other.kind === K.H || other.kind === K.V ? (Math.random() < 0.5 ? K.H : K.V) : other.kind });
          }
        });
        convert.forEach((x, i) => addSeed(x.piece.r, x.piece.c, 520 + i * 90));
        label = other.kind === K.B ? '炸弹风暴！' : other.kind === K.X ? '十字风暴！' : other.kind === K.D ? '钻石风暴！' : '条纹风暴！';
      }
    } else if (pa.kind === K.X && pb.kind === K.X) {
      pa.noTrig = pb.noTrig = true;
      for (let d = -2; d <= 2; d++) {
        for (let c = 0; c < this.w; c++) addSeed(pr + d, c, Math.abs(c - pc) * 20 + Math.abs(d) * 60);
        for (let r = 0; r < this.h; r++) addSeed(r, pc + d, Math.abs(r - pr) * 20 + Math.abs(d) * 60);
        effects.push({ t: 'beam', dir: 'h', r: pr + d, c: pc, delay: Math.abs(d) * 60 }, { t: 'beam', dir: 'v', r: pr, c: pc + d, delay: Math.abs(d) * 60 });
      }
      label = '巨十字风暴！';
    } else if ((pa.kind === K.X && pb.kind === K.D) || (pa.kind === K.D && pb.kind === K.X)) {
      pa.noTrig = pb.noTrig = true;
      for (let d = -1; d <= 1; d++) {
        for (let c = 0; c < this.w; c++) addSeed(pr + d, c, Math.abs(c - pc) * 20 + Math.abs(d) * 50);
        for (let r = 0; r < this.h; r++) addSeed(r, pc + d, Math.abs(r - pr) * 20 + Math.abs(d) * 50);
        effects.push({ t: 'beam', dir: 'h', r: pr + d, c: pc, delay: Math.abs(d) * 50 }, { t: 'beam', dir: 'v', r: pr, c: pc + d, delay: Math.abs(d) * 50 });
      }
      for (let d = 1; d < Math.max(this.w, this.h); d++) {
        addSeed(pr - d, pc - d, d * 26); addSeed(pr - d, pc + d, d * 26);
        addSeed(pr + d, pc - d, d * 26); addSeed(pr + d, pc + d, d * 26);
      }
      effects.push({ t: 'diag', r: pr, c: pc, delay: 0 }, { t: 'flash', delay: 0 });
      label = '米字风暴！';
    } else if (pa.kind === K.D && pb.kind === K.D) {
      pa.noTrig = pb.noTrig = true;
      for (let r = 0; r < this.h; r++) for (let c = 0; c < this.w; c++) {
        const u = (r - pr) - (c - pc), v = (r - pr) + (c - pc);
        if (Math.abs(u) <= 1 || Math.abs(v) <= 1) addSeed(r, c, (Math.abs(r - pr) + Math.abs(c - pc)) * 22);
      }
      effects.push({ t: 'diag', r: pr, c: pc, delay: 0 }, { t: 'flash', delay: 0 });
      label = '双重钻石！';
    } else if (pa.kind === K.X || pb.kind === K.X) {
      pa.noTrig = pb.noTrig = true;
      const other = pa.kind === K.X ? pb : pa;
      if (other.kind === K.B) {
        for (let c = 0; c < this.w; c++) addSeed(pr, c, Math.abs(c - pc) * 24);
        for (let r = 0; r < this.h; r++) addSeed(r, pc, Math.abs(r - pr) * 24);
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) addSeed(pr + dr, pc + dc, 60);
        effects.push({ t: 'beam', dir: 'h', r: pr, c: pc, delay: 0 }, { t: 'beam', dir: 'v', r: pr, c: pc, delay: 0 }, { t: 'ring', r: pr, c: pc, rad: 1, delay: 0 });
        label = '十字爆炸！';
      } else {
        const horiz = other.kind !== K.V;
        for (let d = -1; d <= 1; d++) {
          if (horiz) { for (let c = 0; c < this.w; c++) addSeed(pr + d, c, Math.abs(c - pc) * 20 + Math.abs(d) * 50); effects.push({ t: 'beam', dir: 'h', r: pr + d, c: pc, delay: Math.abs(d) * 50 }); }
          else { for (let r = 0; r < this.h; r++) addSeed(r, pc + d, Math.abs(r - pr) * 20 + Math.abs(d) * 50); effects.push({ t: 'beam', dir: 'v', r: pr, c: pc + d, delay: Math.abs(d) * 50 }); }
        }
        label = horiz ? '三重横扫！' : '三重纵扫！';
      }
    } else if (pa.kind === K.D || pb.kind === K.D) {
      pa.noTrig = pb.noTrig = true;
      const other = pa.kind === K.D ? pb : pa;
      for (let d = 1; d < Math.max(this.w, this.h); d++) {
        addSeed(pr - d, pc - d, d * 26); addSeed(pr - d, pc + d, d * 26);
        addSeed(pr + d, pc - d, d * 26); addSeed(pr + d, pc + d, d * 26);
      }
      effects.push({ t: 'diag', r: pr, c: pc, delay: 0 });
      if (other.kind === K.B) {
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.abs(dr) + Math.abs(dc) <= 2) addSeed(pr + dr, pc + dc, 60);
        effects.push({ t: 'ring', r: pr, c: pc, rad: 2, delay: 0 });
        label = '钻石爆炸！';
      } else {
        if (other.kind !== K.V) { for (let c = 0; c < this.w; c++) addSeed(pr, c, Math.abs(c - pc) * 24); effects.push({ t: 'beam', dir: 'h', r: pr, c: pc, delay: 0 }); }
        else { for (let r = 0; r < this.h; r++) addSeed(r, pc, Math.abs(r - pr) * 24); effects.push({ t: 'beam', dir: 'v', r: pr, c: pc, delay: 0 }); }
        label = '扫射钻石！';
      }
    } else if (pa.kind !== K.B && pb.kind !== K.B) {
      pa.noTrig = pb.noTrig = true;
      for (let c = 0; c < this.w; c++) addSeed(pr, c, Math.abs(c - pc) * 24);
      for (let r = 0; r < this.h; r++) addSeed(r, pc, Math.abs(r - pr) * 24);
      effects.push({ t: 'beam', dir: 'h', r: pr, c: pc, delay: 0 }, { t: 'beam', dir: 'v', r: pr, c: pc, delay: 0 });
      label = '十字消除！';
    } else if (pa.kind === K.B && pb.kind === K.B) {
      pa.noTrig = pb.noTrig = true;
      const rad = 3;
      for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) addSeed(pr + dr, pc + dc, Math.max(Math.abs(dr), Math.abs(dc)) * 40);
      effects.push({ t: 'ring', r: pr, c: pc, rad, delay: 0 });
      label = '超级爆炸！';
    } else {
      pa.noTrig = pb.noTrig = true;
      for (let d = -1; d <= 1; d++) {
        for (let c = 0; c < this.w; c++) addSeed(pr + d, c, Math.abs(c - pc) * 24);
        for (let r = 0; r < this.h; r++) addSeed(r, pc + d, Math.abs(r - pr) * 24);
        effects.push({ t: 'beam', dir: 'h', r: pr + d, c: pc, delay: 0 }, { t: 'beam', dir: 'v', r: pr, c: pc + d, delay: 0 });
      }
      label = '大十字！';
    }
    return { seeds, effects, convert, label };
  }

  // ---- 洗牌 ----
  shuffleLogic() {
    const cells = []; this.each((p, r, c) => cells.push([r, c]));
    const pieces = cells.map(([r, c]) => this.grid[r][c]);
    for (let attempt = 0; attempt < 80; attempt++) {
      for (let i = pieces.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; }
      cells.forEach(([r, c], i) => this.put(pieces[i], r, c));
      if (!this.findMatches(null).length && this.hasMove()) return true;
    }
    for (let attempt = 0; attempt < 300; attempt++) {
      pieces.forEach(p => { if (p.kind !== K.R) p.type = this.randType(); });
      if (!this.findMatches(null).length && this.hasMove()) return true;
    }
    return false;
  }
}

const NullHost = new Proxy({}, { get: () => () => Promise.resolve() });

class Game {
  constructor(level, host) {
    this.lv = level; this.host = host || NullHost;
    this.board = new Board(level); this.board.fillInitial();
    this.score = 0; this.moves = level.moves;
    this.goals = level.goals.map(g => ({ t: g.t, color: g.color, need: g.t === 'jelly' ? this.board.jellyTotal : g.n, have: 0 }));
    this.state = 'idle';             // idle / busy / won / lost
    this.endless = !!level.endless;  // 无尽模式：不限步数、不会失败
    this.hammers = 3; this.shuffles = 2; this.continued = false;
    this.cascade = 0; this.stars = 0;
    this.damp = level.damp !== undefined ? level.damp : 0.8;   // 补位时避免“天降连锁”的概率
  }
  goalDone(g) { return g.t === 'score' ? this.score >= g.need : g.have >= g.need; }
  allDone() { return this.goals.every(g => this.goalDone(g)); }

  async trySwap(a, b) {
    if (this.state !== 'idle') return false;
    const B = this.board;
    if (!B.has(a[0], a[1]) || !B.has(b[0], b[1])) return false;
    const pa = B.grid[a[0]][a[1]], pb = B.grid[b[0]][b[1]];
    if (!pa || !pb) return false;
    this.state = 'busy';
    B.swapCells(a, b);                         // 玩家拖动的 pa 落到 b
    await this.host.onSwap(pa, pb);
    const combo = B.isCombo(pa, pb);
    const ms = combo ? [] : B.findMatches([b, a]);
    if (!combo && !ms.length) {
      B.swapCells(a, b);
      await this.host.onSwapBack(pa, pb);
      this.state = 'idle'; this.host.onIdle();
      return false;
    }
    this.moves--; this.cascade = 0; this.host.onHUD();
    if (combo) await this.runPlan(B.planCombo(pa, pb, b));
    else {
      if (ms.length >= 2) {                     // 一次交换双消 → 奖励钻石海螺
        const plain = ms.filter(g => !g.spawn);
        const g0 = plain.find(g => g.cells.some(([r, c]) => r === b[0] && c === b[1])) || plain[0];
        if (g0) {
          const cand = g0.cells.filter(([r, c]) => B.grid[r][c] && B.grid[r][c].kind === K.N);
          const at = cand.find(([r, c]) => r === b[0] && c === b[1]) || cand[Math.floor(cand.length / 2)];
          if (at) { g0.kind = K.D; g0.spawn = at; }
        }
      }
      await this.matchLoop(ms);
    }
    await this.afterTurn();
    return true;
  }

  async matchLoop(ms) {
    let groups = ms;
    while (groups && groups.length) {
      this.cascade++;
      await this.clearGroups(groups);
      await this.refill();
      groups = this.board.findMatches(null);
    }
  }

  async clearGroups(groups) {
    const B = this.board, seeds = [], spawns = [];
    for (const g of groups) {
      const sp = g.spawn;
      for (const [r, c] of g.cells) { if (sp && r === sp[0] && c === sp[1]) continue; seeds.push({ r, c, delay: 0 }); }
      if (sp) spawns.push({ r: sp[0], c: sp[1], kind: g.kind, piece: B.grid[sp[0]][sp[1]], from: g.cells.filter(([r, c]) => !(r === sp[0] && c === sp[1])) });
    }
    const exp = B.expand(seeds);
    const hit = new Set(exp.cells.map(e => key(e.r, e.c)));
    await this.applyClear(exp, spawns.filter(s => !hit.has(key(s.r, s.c))));
  }

  async applyClear(exp, spawns) {
    spawns = spawns || [];
    const B = this.board, list = exp.cells;
    if (!list.length && !spawns.length) return;
    const mult = 1 + 0.5 * Math.max(0, this.cascade - 1);
    let pts = Math.round(list.length * 30 * mult) + spawns.length * 50;
    const jellyHit = [], collected = [];
    const touched = list.map(e => [e.r, e.c]).concat(spawns.map(s => [s.r, s.c]));
    const jg = this.goals.find(x => x.t === 'jelly');
    for (const [r, c] of touched) {

      if (g && g.have < g.need) { g.have++; collected.push({ piece: p, goal: g, r: e.r, c: e.c }); }

  async runPlan(plan) {
    const B = this.board;

    this.state = 'idle'; this.host.onIdle();
  }

  async shuffle() {

  async useHammer(r, c) {

        if (!sp) break;

        await this.host.wait(140);
      }
      await this.refill();
      const ms = B.findMatches(null);
      if (ms.length) await this.matchLoop(ms);
    }

    this.stars = 1 + (this.score >= st[1] ? 1 : 0) + (this.score >= st[2] ? 1 : 0);

  }
}

function makeHost(game) {
  const live = () => R.game === game, done = Promise.resolve();
  const H = {
    wait(ms) { return live() ? new Promise(res => R.timers.push({ t: ms / 1000, res })) : done; },
    settle() { return live() ? new Promise(res => R.settlers.push({ res, t: 0 })) : done; },
    onSwap(pa, pb) {
      if (!live()) return done; Sound.swap(); R.tweenTo(pa, 0.15); R.tweenTo(pb, 0.15); pa.front = true;
      return H.settle().then(() => { pa.front = false; });
    },
    onSwapBack(pa, pb) { if (!live()) return done; Sound.bad(); R.tweenTo(pa, 0.15); R.tweenTo(pb, 0.15); return H.settle(); },
    onClear(info) {
      if (!live()) return done;
      const { list, spawns, effects, pts, cascade, jellyHit, collected } = info, conv = new Map();
      spawns.forEach(s => s.from.forEach(([r, c]) => conv.set(key(r, c), s)));
      let end = 0, cx = 0, cy = 0;
      for (const e of list) {
        const p = e.piece, s = conv.get(key(e.r, e.c)), d = e.delay / 1000, dur = s ? 0.17 : 0.26;
        p.dying = { t: -d, dur, fired: false, x0: p.x, y0: p.y, to: s ? [s.c, s.r] : null };
        end = Math.max(end, d + dur); cx += e.c; cy += e.r;
      }
      const n = Math.max(1, list.length); cx /= n; cy /= n;
      Sound.clear(cascade, list.length); Sound.vib(list.length > 5 ? 14 : 8);
      effects.forEach(f => R.addEffect(f));
      const [fx, fy] = R.pos(cx, cy);
      R.floater('+' + pts, fx, fy, '#fff', Math.min(36, 20 + cascade * 3), 0.05);
      const words = ['不错!', '甜蜜!', '超甜!', '爆甜!'];
      if (cascade >= 2) R.setPraise(words[Math.min(cascade - 2, 3)], ['#FF6B8F', '#FF9A4A', '#B68DFF', '#2DB3C2'][Math.min(cascade - 2, 3)]);
      else if (list.length >= 9) R.setPraise('好棒!', '#FF9A4A');
      if (!R.reduce && list.length >= 10) R.shake = Math.max(R.shake, 5);
      jellyHit.forEach(j => R.iceBreak(j));
      collected.forEach((x, i) => { const [sx, sy] = R.clientPos(x.piece.x, x.piece.y); UI.fly(game, x.goal, sx, sy, x.piece.type, e2d(x, list) + i * 40); });
      return H.wait((end + 0.07) * 1000);
    },
    onFall(moved, created) { if (!live()) return; moved.forEach(p => { p.delayT = p.c * 0.012; p.vy = 0; }); created.forEach(p => { p.delayT = p.c * 0.012; p.vy = 0; }); },
    onShuffle(ps) { if (!live()) return; Sound.shuffle(); ps.forEach(p => R.tweenTo(p, 0.55, 'inout')); },
    onConvert(ps) {
      if (!live()) return done;
      ps.forEach((p, i) => R.at(i * 0.04, () => { p.pop = 1; const [x, y] = R.pos(p.x, p.y); R.burst(x, y, ['#fff', PAL[p.type].light], 5, R.cell * 3, 's'); }));
      Sound.special(); return H.wait(520);
    },
    onSpecial(p) { if (!live()) return; p.pop = 1; p.sq = 1; const [x, y] = R.pos(p.x, p.y); R.burst(x, y, ['#fff', '#FFE27A', PAL[p.type] ? PAL[p.type].light : '#fff'], 12, R.cell * 4.5, 's'); Sound.special(); },
    onBonusSpecial(p, i) { if (!live()) return; p.pop = 1; const [x, y] = R.pos(p.x, p.y); R.burst(x, y, ['#fff', '#FFE27A'], 8, R.cell * 3.5, 's'); Sound.chime(i); },
    onLabel(t) { UI.toast(t); },
    onGoal() { if (!live()) return; R.setPraise('目标达成!', '#FF6B8F'); Sound.goal(); R.confetti(); },
    onHUD() { if (live()) UI.updateHUD(); },
    onIdle() { if (live()) { R.idleT = 0; UI.afterIdle(); } },
    onWin(res) { if (live()) UI.win(res); },
    onLose() { if (live()) UI.lose(); }
  };
  return H;
}

    $('btn-help').onclick = () => { Sound.unlock(); Sound.tap(); this.helpModal(); };
    $('lv-back').onclick = () => this.show('title');
    $('btn-endless').onclick = () => { Sound.unlock(); Sound.tap(); this.startEndless(); };
    $('t-sound').onclick = () => this.settings(); $('g-sound').onclick = () => this.settings();
    $('g-back').onclick = () => this.pause();
    $('b-hammer').onclick = () => {
      if (!this.canPlay() || this.game.hammers <= 0) return;
      this.hammerMode = !this.hammerMode; $('b-hammer').classList.toggle('armed', this.hammerMode); R.setSel(null);
      if (this.hammerMode) this.toast('点一下想敲掉的小伙伴');
    };
    $('b-shuffle').onclick = () => { if (!this.canPlay() || this.game.shuffles <= 0) return; this.exitHammer(); R.clearHint(); R.setSel(null); this.game.useShuffle(); };
    $('b-hint').onclick = () => { if (this.canPlay()) { this.exitHammer(); R.showHint(); } };
    $('modal').addEventListener('click', e => { if (e.target === $('modal') && this.dismissable) this.closeModal(); });
    document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
    document.addEventListener('visibilitychange', () => { document.hidden ? Sound.suspend() : Sound.resume(); });
    this.bindBoard(); this.renderTitle();
    try {
      const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap';
      l.onload = () => { if (document.fonts) document.fonts.load('28px "ZCOOL KuaiLe"', '甜蜜超爆好棒目标达成洗牌彩虹风暴同色全消奖励0123456789+').catch(() => {}); };
      document.head.appendChild(l);
    } catch (e) {}
  },

  show(name) {
    this.screen = name;
    for (const id of ['title', 'levels', 'game']) $('s-' + id).classList.toggle('on', id === name);
    if (name === 'levels') this.renderLevels();
    if (name === 'title') this.renderTitle();
  },
  renderTitle() {
    $('t-title').textContent = CFG.title; $('t-sub').textContent = '海底三消 · 关卡挑战与无尽模式';
    $('btn-play').textContent = (Store.d.unlocked > 1 || Object.keys(Store.d.stars).length) ? '继续游戏' : '开始游戏';
  },
  renderLevels() {
    const grid = $('lv-grid'); grid.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const n = i + 1, locked = n > Store.d.unlocked, stars = Store.d.stars[n] || 0, cur = n === Store.d.unlocked && !stars;
      const d = document.createElement('div'); d.className = 'lv' + (locked ? ' lock' : stars ? ' done' : '') + (cur ? ' cur' : '');
      d.innerHTML = `<button aria-label="第 ${n} 关${locked ? '（未解锁）' : ''}">${locked ? svg('lock') : n}</button><div class="stars">${[1, 2, 3].map(k => svg('star', 'fill' + (k <= stars ? ' on' : ''))).join('')}</div>`;
      d.querySelector('button').onclick = () => { if (!locked) { Sound.tap(); this.startLevel(i); } };
      grid.appendChild(d);
    });
  },

  /* ----- 弹窗 ----- */
  modal(html, bind, dismissable) {
    $('sheet').innerHTML = html; $('modal').classList.add('on'); this.modalOpen = true; this.dismissable = !!dismissable;
    if (bind) bind($('sheet'));
    const b = $('sheet').querySelector('.btn.primary, .btn'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {}
  },
  closeModal() { $('modal').classList.remove('on'); this.modalOpen = false; R.idleT = 0; },
  toggles() {
    return [['sfx', '音效'], ['music', '音乐']].map(([k, t]) => `<div class="toggle"><span>${t}</span><button class="sw ${Store.d[k] ? 'on' : ''}" role="switch" aria-checked="${!!Store.d[k]}" aria-label="${t}" data-k="${k}"></button></div>`).join('');
  },
  bindToggles(root) {
    root.querySelectorAll('.sw').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = !Store.d[k]; Store.d[k] = v; Store.save(); Sound.set(k, v);
      b.classList.toggle('on', v); b.setAttribute('aria-checked', v); if (k === 'sfx' && v) Sound.tap();
    });
  },
  settings() { this.modal(`<h3>声音</h3>${this.toggles()}<div class="row"><button class="btn primary small" id="m-ok">好的</button></div>`, r => { this.bindToggles(r); $('m-ok').onclick = () => this.closeModal(); }, true); },
  helpModal() {
    const ic = (type, kind) => `<img src="${kind === K.R ? SP.get('pearl', 0, 'happy', 76).toDataURL() : SP.get(type, kind || K.N, 'happy', 76).toDataURL()}" alt="">`;
    this.modal(`<h3>玩法说明</h3>
      <div class="help-sec">基本操作</div>
      <div class="help-row"><span>滑动（或先点一个、再点相邻一个）交换位置，<b>三个同色连成一线</b>即可消除。消除后上方的小伙伴会掉落补位，自动接上新的消除就是<b>连锁</b>，连锁越多分数越高。</span></div>
      <div class="help-sec">特殊小伙伴</div>
      <div class="help-row">${ic(1, K.V)}<span><b>条纹小伙伴</b>：4 连生成。触发时清掉一整行或一整列（横向 4 连生成的清一整列，竖向 4 连生成的清一行）。</span></div>
      <div class="help-row">${ic(0, K.B)}<span><b>炸弹</b>：L 形或 T 形消除生成，引爆周围 3×3。</span></div>
      <div class="help-row">${ic(4, K.X)}<span><b>十字水母</b>：2×2 方块消除生成，触发后<b>整行＋整列</b>十字清除。</span></div>
      <div class="help-row">${ic(2, K.D)}<span><b>钻石海螺</b>：一次交换同时完成<b>两组消除</b>时生成，触发后清除<b>两条对角线</b>。</span></div>
      <div class="help-row">${ic(0, K.R)}<span><b>彩虹珍珠</b>：5 连生成。与任意小伙伴交换，清除全场同色。</span></div>
      <div class="help-sec">特殊组合（把两个特殊小伙伴互换）</div>
      <div class="help-combo"><span>条纹＋条纹 → 十字消除</span><span>条纹＋炸弹 → 大十字</span><span>炸弹＋炸弹 → 超级爆炸</span><span>十字＋十字 → 巨十字风暴</span><span>十字＋钻石 → 米字风暴</span><span>钻石＋钻石 → 双重钻石</span><span>十字＋条纹 → 三重横扫 / 纵扫</span><span>十字＋炸弹 → 十字爆炸</span><span>钻石＋条纹 → 扫射钻石</span><span>钻石＋炸弹 → 钻石爆炸</span><span>珍珠＋普通 → 同色全消</span><span>珍珠＋特殊 → 同色变特殊再全爆</span><span>珍珠＋珍珠 → 彩虹风暴</span></div>
      <div class="help-sec">目标与道具</div>
      <div class="help-note">在限定步数内完成上方目标：收集指定小伙伴、融化冰块（深色冰块要消两次）或达到指定分数。冰块上的小伙伴被消除时，冰块才会融化。<br>底部道具：<b>小锤子</b>敲掉任意一块、<b>洗牌</b>重排盘面、<b>提示</b>指出可消除的一步（长时间不操作也会自动提示）。</div>
      <div class="help-sec">无尽模式</div>
      <div class="help-note">不限步数、不会失败，尽情连锁刷分。打破纪录会自动保存；达到 4000 分后难度提升，海龟小伙伴会加入盘面。</div>
      <div class="row"><button class="btn primary small" id="m-ok">知道了</button></div>`, () => { $('m-ok').onclick = () => { Sound.tap(); this.closeModal(); }; }, true);
  },
  pause() {
    if (!this.game) return;
    this.modal(`<h3>暂停</h3>${this.toggles()}<div class="row"><button class="btn primary" id="m-go">继续</button><button class="btn ghost" id="m-re">重新开始</button><button class="btn ghost" id="m-lv">回到关卡</button><button class="btn ghost small" id="m-help">玩法说明</button></div>`, r => {
      this.bindToggles(r);
      $('m-go').onclick = () => this.closeModal();
      $('m-re').onclick = () => { this.closeModal(); if (this.mode === 'endless') this.startEndless(); else this.startLevel(this.lv); };
      $('m-lv').onclick = () => this.leave();
      $('m-help').onclick = () => this.helpModal();
    }, true);
  },
  leave() { this.closeModal(); R.detach(); this.game = null; this.show(this.mode === 'endless' ? 'title' : 'levels'); },
  /* ----- 关卡流程 ----- */
  startLevel(i) { this.startGame(LEVELS[i], '第 ' + (i + 1) + ' 关', 'levels', i); },
  startEndless() { this.startGame(ENDLESS, '无尽模式', 'endless', -1); },
  startGame(def, title, mode, lv) {
    this.mode = mode; this.lv = lv; R.detach(); this.closeModal();
    const game = new Game(def, null); game.host = makeHost(game);
    this.game = game; this.shown = game.goals.map(() => 0); this.shownScore = 0; this._lastScore = -1; this.flying = 0; this.exitHammer();
    this.bestAtStart = Store.d.endlessBest || 0;
    $('g-title').textContent = title;
    this.show('game'); R.attach(game); this.buildHUD(); this.updateHUD();
    if (mode === 'levels' && lv === 0) R.idleT = 3;
    this.intro();
  },
  intro() {
    const g = this.game, tip = g.lv.tip;
    let head, items;
    if (this.mode === 'endless') {
      head = `<h3>无尽模式</h3><p>不限步数，不会失败，冲击最高分</p>`;
      items = `<div class="goal"><span class="gi" style="background:var(--gold)">${svg('star', 'fill')}</span><span>得分与纪录实时记录</span></div><div class="goal"><span class="gi" style="background:var(--rose)">${svg('heart', 'fill')}</span><span>分数越高，难度会慢慢提升</span></div>`;
    } else {
      const n = this.lv + 1;
      head = `<h3>第 ${n} 关</h3><p>在 ${g.moves} 步内完成目标</p>`;
      items = g.goals.map(goal => {
        if (goal.t === 'collect') return `<div class="goal"><img src="${SP.url(goal.color)}" alt=""><span>收集 ${goal.need} ${PAL[goal.color].unit}${PAL[goal.color].name}</span></div>`;
        if (goal.t === 'jelly') return `<div class="goal"><span class="gi">${svg('ice')}</span><span>融化所有冰块</span></div>`;
        return `<div class="goal"><span class="gi" style="background:var(--gold)">${svg('star', 'fill')}</span><span>得分达到 ${goal.need}</span></div>`;
      }).join('');
    }
    this.modal(`${head}<div class="goal-list">${items}</div>${tip ? `<div class="tip">${esc(tip)}</div>` : ''}<div class="row"><button class="btn primary" id="m-go">开始</button></div>`, () => { $('m-go').onclick = () => { Sound.tap(); this.closeModal(); }; });
  },
  buildHUD() {
    const g = this.game, box = $('h-goals'); box.innerHTML = ''; this.goalEls = [];
    g.goals.forEach(goal => {
      const d = document.createElement('div'); d.className = 'goal';
      d.innerHTML = goal.t === 'collect' ? `<img alt="${PAL[goal.color].name}" src="${SP.url(goal.color)}"><b></b>`
        : goal.t === 'jelly' ? `<span class="gi">${svg('ice')}</span><b></b>` : `<span class="gi" style="background:var(--gold)">${svg('star', 'fill')}</span><b></b>`;
      box.appendChild(d); this.goalEls.push(d);
    });
    const st = g.lv.stars, top = st[2];
    if (this.mode === 'endless') {
      box.innerHTML = `<div class="goal"><span class="gi" style="background:var(--gold)">${svg('star', 'fill')}</span><span class="tx">得分</span><b id="e-score">0</b></div><div class="goal"><span class="gi" style="background:var(--rose)">${svg('heart', 'fill')}</span><span class="tx">纪录</span><b id="e-best">${this.bestAtStart}</b></div>`;
      $('h-marks').innerHTML = '';
    } else {
      $('h-marks').innerHTML = [0, st[1] / top * 100, 100].map(p => `<span class="mk" style="left:${p}%">${svg('star', 'fill')}</span>`).join('');
    }
  },
  updateHUD() {
    const g = this.game; if (!g) return;
    const mv = $('h-moves'); mv.textContent = g.moves === Infinity ? '∞' : g.moves; mv.classList.toggle('low', g.moves <= 3 && g.state !== 'won');
    g.goals.forEach((goal, i) => {
      const el = this.goalEls[i]; if (!el) return;
      let left = goal.t === 'collect' ? goal.need - this.shown[i] : goal.t === 'jelly' ? goal.need - goal.have : goal.need - Math.floor(this.shownScore);
      left = Math.max(0, left); const b = el.querySelector('b'), txt = left > 0 ? String(left) : '✓';
      if (b.textContent !== txt) b.textContent = txt; el.classList.toggle('done', left <= 0);
    });
    const hb = $('b-hammer'), sb = $('b-shuffle');
    hb.querySelector('.cnt').textContent = g.hammers; hb.disabled = g.hammers <= 0;
    sb.querySelector('.cnt').textContent = g.shuffles; sb.disabled = g.shuffles <= 0;
  },
  tick(dt) {
    const g = this.game; if (!g || this.screen !== 'game') return;
    const diff = g.score - this.shownScore;
    if (Math.abs(diff) > 0.5) this.shownScore += diff * Math.min(1, dt * 7); else this.shownScore = g.score;
    const s = Math.round(this.shownScore);
    if (s !== this._lastScore) {
      this._lastScore = s; $('h-score').textContent = s;
      if (this.mode === 'endless') {
        if (s > (Store.d.endlessBest || 0)) { Store.d.endlessBest = s; Store.save(); }
        const base = this.bestAtStart > 0 ? this.bestAtStart : 1000;
        $('h-fill').style.width = Math.min(100, s / base * 100) + '%';
        const es = $('e-score'); if (es) es.textContent = s;
        const eb = $('e-best'); if (eb) eb.textContent = Math.max(this.bestAtStart, Store.d.endlessBest || 0, s);
      } else {
        const st = g.lv.stars; $('h-fill').style.width = Math.min(100, s / st[2] * 100) + '%';
        const mk = $('h-marks').children;
        if (mk.length === 3) { mk[0].classList.toggle('on', g.state === 'won' || g.allDone()); mk[1].classList.toggle('on', s >= st[1]); mk[2].classList.toggle('on', s >= st[2]); }
        if (g.goals.some(x => x.t === 'score')) this.updateHUD();
      }
    }
  },
  toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('on'), 1900); },
  fly(game, goal, x, y, type, delay) {
    const gi = game.goals.indexOf(goal), el = this.goalEls[gi];
    const arrive = () => { if (this.game !== game) return; this.shown[gi] = Math.min(goal.need, this.shown[gi] + 1); el && (el.classList.remove('bump'), void el.offsetWidth, el.classList.add('bump')); this.updateHUD(); };
    if (!el || !el.animate || R.reduce) { arrive(); return; }
    const app = $('app').getBoundingClientRect(), tr = el.getBoundingClientRect(), img = document.createElement('img');
    img.className = 'fly'; img.src = SP.url(type); img.alt = ''; $('app').appendChild(img);
    const x0 = x - app.left - 15, y0 = y - app.top - 15, x1 = tr.left - app.left + 18, y1 = tr.top - app.top + 8;
    this.flying++;
    const a = img.animate([
      { transform: `translate(${x0}px,${y0}px) scale(1)`, opacity: 1 },
      { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 26}px) scale(1.25)`, opacity: 1, offset: 0.5 },
      { transform: `translate(${x1}px,${y1}px) scale(.55)`, opacity: 0.9 }
    ], { duration: 640, delay: delay || 0, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
    a.onfinish = () => { img.remove(); this.flying--; arrive(); };
    a.oncancel = () => { img.remove(); this.flying = Math.max(0, this.flying - 1); };
  },
  afterIdle() {
    const g = this.game; if (!g) return;
    if (this.flying <= 0) g.goals.forEach((goal, i) => { if (goal.t === 'collect') this.shown[i] = goal.have; });
    this.updateHUD();
  },
  win(res) {
    const g = this.game, n = this.lv + 1;
    g.goals.forEach((goal, i) => { if (goal.t === 'collect') this.shown[i] = goal.have; }); this.updateHUD();
    Sound.win();
    Store.d.stars[n] = Math.max(Store.d.stars[n] || 0, res.stars);
    Store.d.unlocked = Math.max(Store.d.unlocked, Math.min(LEVELS.length, n + 1));
    Store.save();
    setTimeout(() => { if (this.game === g) this.winModal(res, n); }, 900);
  },
  winModal(res, n) {
    const last = n === LEVELS.length;
    const stars = [0, 1, 2].map(i => svg('star', 'fill' + (i < res.stars ? ' on' : ''), `style="--i:${i}"`)).join('');
    const primary = last ? '再闯一次' : '下一关';
    this.modal(`<h3>过关啦</h3><div class="big-stars">${stars}</div><p class="score-big">${Math.round(res.score)} 分</p><div class="row"><button class="btn primary" id="m-main">${primary}</button><button class="btn ghost small" id="m-re">再玩一次</button><button class="btn ghost small" id="m-lv">回到关卡</button></div>`, () => {
      $('m-main').onclick = () => { Sound.tap(); if (last) this.startLevel(0); else this.startLevel(n); };
      $('m-re').onclick = () => this.startLevel(this.lv); $('m-lv').onclick = () => this.leave();
    });
  },
  lose() {
    const g = this.game; Sound.lose();
    setTimeout(() => {
      if (this.game !== g) return;
      this.modal(`<h3>步数用完了</h3><p>差一点点就成功了，再来一次吧。</p><div class="row">${g.continued ? '' : '<button class="btn sea" id="m-more">加 5 步继续</button>'}<button class="btn primary" id="m-re">再试一次</button><button class="btn ghost small" id="m-lv">回到关卡</button></div>`, () => {
        const m = $('m-more'); if (m) m.onclick = () => { if (g.continueMoves()) { this.closeModal(); this.toast('多了 5 步，加油！'); } };
        $('m-re').onclick = () => this.startLevel(this.lv); $('m-lv').onclick = () => this.leave();
      });
    }, 500);
  },
  /* ----- 棋盘输入 ----- */
  canPlay() { return !this.modalOpen && this.screen === 'game' && this.game && this.game.state === 'idle' && R.game === this.game; },
  exitHammer() { this.hammerMode = false; $('b-hammer').classList.remove('armed'); },
  bindBoard() {
    const wrap = $('board-wrap'); let ptr = null;
    wrap.addEventListener('pointerdown', e => {
      if (!this.canPlay()) return;
      const cell = R.hit(e.clientX, e.clientY); if (!cell) return;
      R.clearHint(); ptr = { id: e.pointerId, r: cell[0], c: cell[1], x: e.clientX, y: e.clientY, done: false };
      try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    });
    wrap.addEventListener('pointermove', e => {
      if (!ptr || ptr.done || e.pointerId !== ptr.id || !this.canPlay() || this.hammerMode) return;
      const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
      if (Math.hypot(dx, dy) < R.cell * 0.32) return;
      ptr.done = true; let dr = 0, dc = 0;
      if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1; else dr = dy > 0 ? 1 : -1;
      this.swap(ptr.r, ptr.c, ptr.r + dr, ptr.c + dc);
    });
    wrap.addEventListener('pointerup', e => { if (!ptr || e.pointerId !== ptr.id) return; const p = ptr; ptr = null; if (!p.done) this.tapCell(p.r, p.c); });
    wrap.addEventListener('pointercancel', () => { ptr = null; });
  },
  swap(r1, c1, r2, c2) {
    if (!this.canPlay() || !this.game.board.has(r2, c2)) return;
    R.setSel(null); this.game.trySwap([r1, c1], [r2, c2]);
  },
  tapCell(r, c) {
    if (!this.canPlay()) return;
    if (this.hammerMode) { this.exitHammer(); R.clearHint(); this.game.useHammer(r, c); return; }
    const s = R.sel;
    if (s && s[0] === r && s[1] === c) { R.setSel(null); return; }
    if (s && Math.abs(s[0] - r) + Math.abs(s[1] - c) === 1) { this.swap(s[0], s[1], r, c); return; }
    R.setSel([r, c]);
  }
};

let _last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - _last) / 1000 || 0.016); _last = ts;
  R.update(dt);
  if (UI.screen === 'game' && R.game) R.draw(); else if (UI.screen === 'title') Mascot.draw(dt);
  requestAnimationFrame(loop);
}
UI.init();
requestAnimationFrame(loop);
</script>
</body>
</html>
